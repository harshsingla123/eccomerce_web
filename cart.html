<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Cart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">


</head>

<body>

    <nav>

        <div class="logo">
            Shop<span>Ease</span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#goproducts">Products</a></li>
            <li><a href="index.html#categories">Categories</a></li>
        </ul>

        <div class="nav-icons">

            <a href="cart.html">
                <div class="icon cart">
                    🛒
                    <span class="cart-icon">0</span>
                </div>
            </a>

        </div>

    </nav>


    <main class="cart-page">

        <h1 class="cart-title">
            Your Shopping Cart
        </h1>

        <div class="cart-container">

            <!-- CART ITEMS -->

            <div class="cart-items js-cart-items">

               

            </div>


            <!-- CART SUMMARY -->

            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Items</span>
                    <span class="js-item-count">0</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span class="js-subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>FREE</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span class="js-total">₹0</span>
                </div>

                <button class="checkout-btn">
                    Proceed To Checkout
                </button>

            </div>

        </div>

    </main>


    <script type="module" src="checkout.js"></script>

</body>

</html>
